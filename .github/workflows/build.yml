name: Build unsigned iPhone probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          brew install xcodegen
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable aarch64-apple-ios
      - name: Fetch pinned idevice and apply local patch
        run: |
          git clone https://github.com/jkcoxson/idevice vendor/idevice
          git -C vendor/idevice checkout d32c8189c51c2789496b0768039419c3705498c3
          git -C vendor/idevice apply ../../patches/idevice-run-over-rsd.patch
          git -C vendor/idevice diff --stat
      - name: Test PC pairing inbox
        run: |
          swiftc App/PairingSetup.swift tests/PairingSetupTests.swift -o "$RUNNER_TEMP/pairing-setup-tests"
          "$RUNNER_TEMP/pairing-setup-tests"
      - name: Test diagnostic reporting
        working-directory: core
        run: cargo +stable test diagnostics::tests -- --test-threads=1
      - name: Test Gemini response parsing
        # No API calls or device access required.
        run: |
          swiftc App/AgentResponse.swift tests/AgentResponseTests.swift -o "$RUNNER_TEMP/agent-response-tests"
          "$RUNNER_TEMP/agent-response-tests"
      - name: Test image coordinate conversion
        working-directory: core
        run: cargo +stable test coordinates::tests
      - name: Build Rust core
        working-directory: core
        run: cargo +stable build --release --target aarch64-apple-ios
      - name: Build iPhone application
        run: |
          xcodegen generate
          xcodebuild -project PhoneRunnerProbe.xcodeproj -scheme PhoneRunnerProbe -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/PhoneRunnerProbe.app package/Payload/
          cd package
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' Payload/PhoneRunnerProbe.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' Payload/PhoneRunnerProbe.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' Payload/PhoneRunnerProbe.app/Info.plist
          test -f Payload/PhoneRunnerProbe.app/Assets.car
          zip -qr ../PhoneRunnerProbe-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneRunnerProbe-unsigned
          path: PhoneRunnerProbe-unsigned.ipa
          retention-days: 7
