[package]
name = "phone_runner_probe"
version = "0.8.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

# idevice is cloned at the pinned revision d32c8189c51c2789496b0768039419c3705498c3
# and patched with patches/idevice-run-over-rsd.patch by the build workflow.
[dependencies]
idevice = { path = "../vendor/idevice/idevice", default-features = false, features = ["ring", "tcp", "remote_pairing", "rsd", "tunnel_tcp_stack", "installation_proxy", "xctest"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync", "io-util"] }
serde_json = "1"
base64 = "0.22"
